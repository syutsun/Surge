name: Update Moyu StartUpAds
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-startup-ads.mjs
      - .github/workflows/update-startup-ads.yml
permissions:
  contents: write
concurrency:
  group: update-moyu-startup-ads
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch, convert and validate original upstream
        run: node scripts/build-startup-ads.mjs
      - name: Commit validated module if changed
        run: |
          git diff --check
          if git diff --quiet -- Module/StartUpAds.sgmodule; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Module/StartUpAds.sgmodule
          git commit -m "chore: sync original Moyu startup ad rules"
          git push origin HEAD:main

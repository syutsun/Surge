name: Daily updates at 08 China time
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/*.yml
permissions:
  contents: write
concurrency:
  group: daily-upstream-updates
  cancel-in-progress: false
jobs:
  startup_ads:
    name: 去开屏模块
    uses: ./.github/workflows/update-startup-ads.yml
  ai:
    name: AI 规则
    needs: startup_ads
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-ai.yml
  tracking:
    name: Tracking 规则
    needs: ai
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-tracking.yml
  streaming:
    name: 个性化流媒体规则
    needs: tracking
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-streaming.yml
  direct_plus:
    name: Direct+ 规则
    needs: streaming
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-direct-plus.yml
  direct:
    name: Direct 规则
    needs: direct_plus
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-direct.yml
  modules:
    name: 自定义名称模块
    needs: direct
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-modules.yml
  mirrors:
    name: 原样同步规则和模块
    needs: modules
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-upstream-mirrors.yml

name: Update selected RuleGo rules
on:
  schedule:
    - cron: '3 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_selected_rules.py
      - scripts/test_sync_selected_rules.py
      - .github/workflows/update-selected-rules.yml
permissions:
  contents: write
concurrency:
  group: update-moyu-startup-ads
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test six-file mirror validation
        run: python -m unittest discover -s scripts -p test_sync_selected_rules.py -v
      - name: Download and validate original upstream rules
        run: python scripts/sync_selected_rules.py
      - name: Commit changed selected rules only
        run: |
          if git diff --quiet -- Ruleset/PayPal.list 'Ruleset/Proxy+.list' Ruleset/Proxy.list Ruleset/Telegram.list Ruleset/WeChat.list Ruleset/X.list; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Ruleset/PayPal.list 'Ruleset/Proxy+.list' Ruleset/Proxy.list Ruleset/Telegram.list Ruleset/WeChat.list Ruleset/X.list
          git commit -m "chore: sync PayPal Proxy Telegram WeChat and X rules"
          git push origin HEAD:main

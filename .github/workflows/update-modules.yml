name: Update Surge modules with personal names
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/Module-upstreams.json
      - scripts/sync_modules.py
      - scripts/test_sync_modules.py
permissions:
  contents: write
concurrency:
  group: update-moyu-startup-ads
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native module preservation
        run: python -m unittest discover -s scripts -p test_sync_modules.py -v
      - name: Download modules and preserve personal names
        run: python scripts/sync_modules.py
      - name: Commit changed modules only
        run: |
          if git diff --quiet -- 'Module/Bilibili.sgmodule' 'Module/Spotify.sgmodule' 'Module/YouTube.sgmodule' 'Module/Zhihu.sgmodule'; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Module/Bilibili.sgmodule' 'Module/Spotify.sgmodule' 'Module/YouTube.sgmodule' 'Module/Zhihu.sgmodule'
          git commit -m "chore: sync Surge modules with personal names"
          git push origin HEAD:main

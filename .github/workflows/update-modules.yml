name: Update original Surge modules
on:
  schedule:
    - cron: '3 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/Module-upstreams.json
      - scripts/sync_modules.py
      - scripts/test_sync_modules.py
      - .github/workflows/update-modules.yml
permissions:
  contents: write
concurrency:
  group: update-moyu-startup-ads
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native module preservation
        run: python -m unittest discover -s scripts -p test_sync_modules.py -v
      - name: Download and validate original upstream modules
        run: python scripts/sync_modules.py
      - name: Commit changed modules only
        run: |
          if git diff --quiet -- 'Module/Advertising.sgmodule' 'Module/Script Hub.sgmodule' 'Module/Spotify.sgmodule' 'Module/Sub-Store.sgmodule' 'Module/YouTube.sgmodule' 'Module/Zhihu.sgmodule'; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Module/Advertising.sgmodule' 'Module/Script Hub.sgmodule' 'Module/Spotify.sgmodule' 'Module/Sub-Store.sgmodule' 'Module/YouTube.sgmodule' 'Module/Zhihu.sgmodule'
          git commit -m "chore: sync original Surge modules"
          git push origin HEAD:main

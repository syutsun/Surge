name: Update personal Streaming rules
on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/Spotify-personal.list
      - scripts/sync_streaming.py
      - scripts/test_sync_streaming.py
      - .github/workflows/update-streaming.yml
permissions:
  contents: write
concurrency:
  group: update-moyu-startup-ads
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test personal section preservation
        run: python -m unittest discover -s scripts -p test_sync_streaming.py -v
      - name: Sync all streaming rules and preserve personal Spotify
        run: python scripts/sync_streaming.py
      - name: Commit changed rules
        run: |
          git diff --check -- Ruleset/Streaming/
          if git diff --quiet -- Ruleset/Streaming/; then
            echo "No rules changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Ruleset/Streaming/
          git commit -m "chore: sync all streaming rules and preserve personal Spotify"
          git push origin HEAD:main
